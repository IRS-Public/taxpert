[project]
name = "api"
version = "0.1.0"
description = "LLM chat backend for taxpert"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "litellm>=1.50",
    "lxml>=5.3",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "chromadb>=0.5",
    "beautifulsoup4>=4.12",
    "ollama>=0.6.2",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "black[jupyter]>=24.8,<27",
    "pre-commit>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | \.pytest_cache
)/
'''

[dependency-groups]
dev = [
    "isort==9.0.1",
]
