services:
  assistant:
    environment:
      UVICORN_RELOAD: "1"
      WATCHFILES_FORCE_POLLING: "true"
      SCENARIOS_DIR: ${TAXPERT_SCENARIOS_DIR:-/apps/credit-assistant/src/main/resources/credit-assistant/scenarios}
      FLOW_DIR: ${TAXPERT_FLOW_DIR:-/apps/credit-assistant/src/main/resources/credit-assistant/flow}
    volumes:
      - ./services/assistant/src:/app/src
      - ${TAXPERT_APPS_DIR:-./apps}:/apps:ro

  # --- fact-explorer: Vite dev server  -----------------------------------
  fact-explorer:
    build:
      target: build
    working_dir: /workspace/packages/fact-explorer
    environment:
      VITE_USE_POLLING: "true"
      FORM_BUILDER_APPS_DIR: /apps
      # Where an application living outside TAXPERT_APPS_DIR is mounted — one directory per app, by
      # the fragments in docker-compose.apps.d/. It is a second root rather than a subdirectory of
      # /apps because /apps is a read-only bind mount: nesting a mount inside one fails, since
      # Docker has to create the mountpoint in the parent. See appsDirs() in build-registry.mjs.
      FORM_BUILDER_EXTRA_APPS_DIRS: /apps-external
      VITE_FGM_SOURCE: "real"
      VITE_APP_ORIGIN_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "-c", "npm run make-fgm || true; npm run dev -- --host 0.0.0.0 --port 80"]
    volumes:
      - ./packages/fact-explorer:/workspace/packages/fact-explorer
      - ./packages/ui:/workspace/packages/ui
      - /workspace/node_modules
      - /workspace/packages/fact-explorer/node_modules
      - ${TAXPERT_APPS_DIR:-./apps}:/apps:ro
